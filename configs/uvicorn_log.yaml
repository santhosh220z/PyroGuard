version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  file:
    class: logging.FileHandler
    filename: logs/server.log
    formatter: default
    encoding: utf-8
loggers:
  uvicorn:
    level: INFO
    handlers: [file]
    propagate: false
  uvicorn.access:
    level: INFO
    handlers: [file]
    propagate: false
