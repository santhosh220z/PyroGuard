# PyroGuard Docker Compose - Development
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pyroguard-app
    ports:
      - "8000:8000"
    environment:
      - DRY_RUN=true
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./runs:/app/runs
      - ./configs:/app/configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: pyroguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pyroguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: