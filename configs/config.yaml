# PyroGuard Configuration

# Model settings
MODEL_PATH: models/fire_smoke_yolo11s.pt
CONFIDENCE_THRESHOLD: 0.25
IOU_THRESHOLD: 0.45

# Detection settings
CONFIRMATION_FRAMES: 3
CONFIRMATION_WINDOW: 5  # seconds
ALERT_COOLDOWN: 30  # seconds

# Camera settings
CAMERA_SOURCE: 0
IMAGE_SIZE: 640

# Cameras to monitor (single live webcam; rtsp:// upgrade can come later)
CAMERAS:
  - id: camera_01
    name: Live Camera
    source: 0
    enabled: true

# Database settings (unused while automations are deferred)
DATABASE_URL: sqlite:///data/incidents/incidents.db

# Alert settings (deferred; automations come later)
SMTP_HOST: ""
SMTP_PORT: 587
SMTP_USERNAME: ""
SMTP_PASSWORD: ""
TELEGRAM_BOT_TOKEN: ""
TELEGRAM_CHAT_ID: ""
WEBHOOK_URL: ""

# Logging
LOG_LEVEL: INFO

# Mode
DRY_RUN: true