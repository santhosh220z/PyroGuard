# PyroGuard Docker Compose - Production
version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pyroguard-app
    # No ports exposed directly - nginx handles external access
    expose:
      - "8000"
    environment:
      - DRY_RUN=${DRY_RUN:-false}
      - LOG_LEVEL=INFO
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - API_KEYS=${API_KEYS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - pyroguard-data:/app/data
      - pyroguard-models:/app/models
      - pyroguard-runs:/app/runs
      - ./configs:/app/configs:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
        reservations:
          memory: 2G
          cpus: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: pyroguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - app
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    container_name: pyroguard-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  pyroguard-data:
  pyroguard-models:
  pyroguard-runs:
  redis-data:
  nginx-cache: